<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>H2 Biology: Translation Model</title>
    <style>
        :root {
            --site-width: 90px;
            --ribosome-bg: #fff9c4;
            --mrna-bg: #c8e6c9;
            --trna-color: #64b5f6;
            --aa-color: #ff8a80;
        }

        body {
            font-family: 'Helvetica Neue', Arial, sans-serif;
            background-color: #f0f4f8;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin: 0;
            padding: 10px;
        }

        .header { text-align: center; max-width: 500px; }
        h1 { font-size: 1.4rem; color: #1a237e; margin-bottom: 5px; }
        p { font-size: 0.85rem; color: #444; }

        /* Ribosome Layout */
        #ribosome-container {
            position: relative;
            width: 320px;
            height: 380px;
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
            margin-top: 20px;
            overflow: hidden;
        }

        /* The Large Subunit Site Markers */
        .large-subunit {
            position: absolute;
            top: 40px;
            left: 50%;
            transform: translateX(-50%);
            width: 280px;
            height: 220px;
            background: var(--ribosome-bg);
            border: 4px solid #fbc02d;
            border-radius: 100px 100px 20px 20px;
            display: flex;
            z-index: 1;
        }

        .site {
            flex: 1;
            border-right: 2px dashed #fbc02d;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-top: 10px;
        }
        .site:last-child { border-right: none; }
        .site-label { font-weight: bold; color: #f57f17; font-size: 1.2rem; }

        /* mRNA logic */
        .mrna-track {
            position: absolute;
            top: 260px;
            height: 40px;
            background: var(--mrna-bg);
            display: flex;
            transition: left 0.6s cubic-bezier(0.45, 0.05, 0.55, 0.95);
            z-index: 2;
            padding: 0 10px;
        }

        .codon {
            width: var(--site-width);
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: monospace;
            font-weight: bold;
            font-size: 1.1rem;
            color: #2e7d32;
            border-left: 1px solid rgba(0,0,0,0.1);
        }

        /* tRNA logic */
        .trna {
            position: absolute;
            width: var(--site-width);
            height: 150px;
            display: flex;
            flex-direction: column;
            align-items: center;
            transition: all 0.6s ease;
            z-index: 10;
        }

        .amino-acid {
            width: 38px;
            height: 38px;
            background: var(--aa-color);
            border: 2px solid #d32f2f;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 0.75rem;
            font-weight: bold;
            color: white;
            margin-bottom: 2px;
            transition: transform 0.4s ease;
        }

        .trna-arm {
            width: 6px;
            height: 60px;
            background: var(--trna-color);
        }

        .anticodon {
            background: var(--trna-color);
            color: white;
            padding: 4px 8px;
            border-radius: 4px 4px 0 0;
            font-family: monospace;
            font-weight: bold;
            font-size: 1rem;
            /* This ensures it touches the mRNA */
            margin-top: -2px; 
        }

        /* UI Controls */
        .controls {
            width: 320px;
            padding: 15px;
            background: #fff;
            margin-top: 10px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }

        .status-box {
            background: #e8f5e9;
            padding: 10px;
            border-left: 4px solid #4caf50;
            font-size: 0.85rem;
            margin-bottom: 10px;
            min-height: 60px;
        }

        button {
            width: 100%;
            padding: 12px;
            background: #1a237e;
            color: white;
            border: none;
            border-radius: 5px;
            font-weight: bold;
            cursor: pointer;
        }
        button:disabled { background: #9fa8da; }

        .peptide-link {
            position: absolute;
            width: 20px;
            height: 4px;
            background: #333;
            z-index: 11;
        }
    </style>
</head>
<body>

<div class="header">
    <h1>Interactive Translation</h1>
    <p>H2 Biology: mRNA → Polypeptide (EPA Model)</p>
</div>

<div id="ribosome-container">
    <div class="large-subunit">
        <div class="site"><span class="site-label">E</span></div>
        <div class="site"><span class="site-label">P</span></div>
        <div class="site"><span class="site-label">A</span></div>
    </div>

    <!-- tRNAs will be injected here -->
    <div id="tRNA-layer"></div>

    <div class="mrna-track" id="mrna" style="left: 20px;">
        <!-- Codons injected by JS -->
    </div>
</div>

<div class="controls">
    <div class="status-box" id="status">
        <b>Pre-Initiation:</b> The small ribosomal subunit binds to mRNA. Click 'Start' to bring the initiator tRNA to the P-site.
    </div>
    <button id="btn-next" onclick="processStep()">Start Initiation</button>
</div>

<script>
    const codons = ["AUG", "UUU", "GGC", "UAA"];
    const antis = ["UAC", "AAA", "CCG", "---"];
    const aminos = ["Met", "Phe", "Gly", "STOP"];

    let step = 0;
    const mrnaEl = document.getElementById('mrna');
    const trnaLayer = document.getElementById('tRNA-layer');
    const statusEl = document.getElementById('status');
    const btnNext = document.getElementById('btn-next');

    // Site X-Positions (Relative to container)
    const POS = { E: 25, P: 115, A: 205 };

    function init() {
        codons.forEach(c => {
            const div = document.createElement('div');
            div.className = 'codon';
            div.innerText = c;
            mrnaEl.appendChild(div);
        });
    }

    function spawnTRNA(index, site) {
        const t = document.createElement('div');
        t.className = 'trna';
        t.id = `trna-${index}`;
        t.style.left = POS[site] + "px";
        t.style.top = "112px"; // Perfectly aligns anticodon to mRNA

        t.innerHTML = `
            <div class="amino-acid" id="aa-${index}">${aminos[index]}</div>
            <div class="trna-arm"></div>
            <div class="anticodon">${antis[index]}</div>
        `;
        trnaLayer.appendChild(t);
        return t;
    }

    function processStep() {
        switch(step) {
            case 0: // Initiation
                spawnTRNA(0, 'P');
                statusEl.innerHTML = "<b>Initiation:</b> Initiator tRNA (Met) binds to <b>AUG</b> codon at the <b>P-site</b> via complementary base pairing.";
                btnNext.innerText = "Next: Elongation (A-site entry)";
                step++;
                break;

            case 1: // Elongation - A site
                spawnTRNA(1, 'A');
                statusEl.innerHTML = "<b>Elongation:</b> Next aminoacyl-tRNA (Phe) enters the <b>A-site</b>. Anticodon AAA pairs with UUU codon.";
                btnNext.innerText = "Next: Peptide Bond Formation";
                step++;
                break;

            case 2: // Peptide Bond
                const met = document.getElementById('aa-0');
                met.style.transform = "translate(90px, 0px)"; // Moves to A-site AA
                statusEl.innerHTML = "<b>Peptidyl Transferase:</b> This ribozyme catalyzes a peptide bond. The Met is transferred to the tRNA in the A-site.";
                btnNext.innerText = "Next: Translocation";
                step++;
                break;

            case 3: // Translocation
                // Move mRNA left
                mrnaEl.style.left = "-70px"; 
                
                // Move tRNAs
                const t0 = document.getElementById('trna-0');
                const t1 = document.getElementById('trna-1');
                
                t0.style.left = POS.E + "px";
                t0.style.opacity = "0.4";
                
                t1.style.left = POS.P + "px";

                statusEl.innerHTML = "<b>Translocation:</b> Ribosome moves one codon 5' to 3'. Deacylated tRNA moves to <b>E-site</b> to exit. Peptidyl-tRNA moves to <b>P-site</b>.";
                btnNext.innerText = "Next: Termination";
                step++;
                break;

            case 4: // Termination
                const tExit = document.getElementById('trna-0');
                if(tExit) tExit.remove();
                
                statusEl.innerHTML = "<b>Termination:</b> Stop codon (UAA) reaches A-site. No tRNA binds; instead, a <b>Release Factor</b> binds, hydrolyzing the chain.";
                btnNext.innerText = "Reset Simulation";
                btnNext.onclick = () => location.reload();
                break;
        }
    }

    init();
</script>

</body>
</html>
